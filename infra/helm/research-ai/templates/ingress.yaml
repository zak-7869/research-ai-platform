{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-ai
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: research-ai-backend, port: {number: {{ .Values.backend.port }} }}
          - path: /health
            pathType: Exact
            backend:
              service: {name: research-ai-backend, port: {number: {{ .Values.backend.port }} }}
          - path: /
            pathType: Prefix
            backend:
              service: {name: research-ai-frontend, port: {number: {{ .Values.frontend.port }} }}
{{- end }}
