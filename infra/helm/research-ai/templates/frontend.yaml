apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-ai-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: {app: research-ai-frontend}
  template:
    metadata:
      labels: {app: research-ai-frontend}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          ports: [{containerPort: {{ .Values.frontend.port}}}]
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: research-ai-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: research-ai-frontend}
  ports: [{port: {{ .Values.frontend.port }}, targetPort: {{ .Values.frontend.port }} }]
